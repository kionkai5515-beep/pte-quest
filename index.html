<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171d3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PTE Quest"><link rel="manifest" href="manifest.json"><title>PTE Quest</title><style>body{margin:0;background:#111631;color:#fff;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:540px;margin:auto;padding:25px 18px 80px}h1{font-size:31px}h2{font-size:21px}.card{background:#222a52;border-radius:20px;padding:19px;margin:15px 0}.muted{color:#b9c3e5}.pill{display:inline-block;background:#414a85;padding:8px 13px;border-radius:30px}button,textarea{font:inherit}button{display:block;width:100%;text-align:left;border:1px solid #5865a1;background:#303b72;color:white;padding:15px;border-radius:14px;margin:9px 0}button.primary{background:#7967f5;text-align:center;font-weight:700}button:disabled{opacity:.6}textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:12px;min-height:100px}nav{display:flex;gap:8px}.good{color:#91edb5}.bad{color:#ffaaa9}</style></head><body><main><h1>🎓 PTE Quest</h1><p class="muted">每天 30 分钟 · 2027 年 1 月目标 70+</p><div class="card"><span class="pill" id="xp">⭐ 0 XP</span> <span class="pill" id="streak">🔥 0 天</span><p id="status" class="muted">开始今天的学习任务</p></div><nav><button onclick="start('reading')">📖 阅读</button><button onclick="start('listening')">🎧 听力</button><button onclick="start('writing')">✍️ 写作</button></nav><div id="game" class="card"><h2>欢迎来到第一关</h2><p>阅读和听力每题 10 XP；写作提供自我检查，不做虚假的 PTE 官方评分。</p><button class="primary" onclick="start('reading')">开始闯关 →</button></div><p class="muted" style="font-size:12px">独立学习工具，非 Pearson 官方产品。练习题为原创示例；分数不代表 PTE 成绩。</p></main><script>const questions={reading:[{q:'The chef is responsible ___ preparing the meals.',o:['for','to','at','with'],a:0,e:'Responsible for 是固定搭配。'},{q:'The policy will have a significant ___ on students.',o:['affect','effect','effective','affects'],a:1,e:'Have an effect on = 对……产生影响。'},{q:'If I ___ more time, I would practise daily.',o:['have','had','will have','having'],a:1,e:'第二条件句使用 if + 过去式。'}],listening:[{q:'The library will close earlier on Friday.',o:['The library will close earlier on Friday.','The library will open earlier on Friday.','The library will close later on Friday.'],a:0,e:'留意 close earlier。'},{q:'Students must submit their assignments by Monday.',o:['Students must submit by Sunday.','Students must submit by Monday.','Students may submit by Tuesday.'],a:1,e:'留意 Monday。'}]};let mode='reading',i=0,answered=false;let data=JSON.parse(localStorage.getItem('ptequest')||'{"xp":0,"days":[]}');function save(){localStorage.setItem('ptequest',JSON.stringify(data));document.getElementById('xp').textContent='⭐ '+data.xp+' XP';document.getElementById('streak').textContent='🔥 '+streak()+' 天';document.getElementById('status').textContent='累计学习 '+data.days.length+' 天（本机保存）'}function streak(){let n=0,d=new Date();for(let j=0;j<365;j++){let key=d.toLocaleDateString('en-CA');if(data.days.includes(key))n++;else if(j>0||!data.days.includes(new Date(Date.now()-86400000).toLocaleDateString('en-CA')))break;d.setDate(d.getDate()-1)}return n}function reward(){data.xp+=10;let d=new Date().toLocaleDateString('en-CA');if(!data.days.includes(d))data.days.push(d);save()}function start(m){mode=m;i=0;render()}function speak(){let u=new SpeechSynthesisUtterance(questions.listening[i].q);u.lang='en-AU';u.rate=.86;speechSynthesis.cancel();speechSynthesis.speak(u)}function render(){answered=false;let g=document.getElementById('game');if(mode==='writing'){g.innerHTML='<h2>✍️ Writing Practice</h2><p>用一句英文概括：Regular exercise improves physical health, supports mental well-being, and helps people manage stress.</p><textarea id="draft" placeholder="Write your summary here..."></textarea><button class="primary" onclick="checkWriting()">检查参考答案</button><div id="feedback"></div>';return}let arr=questions[mode];if(i>=arr.length){g.innerHTML='<h2>🏆 本关完成！</h2><p>你已经完成 '+arr.length+' 道练习。继续保持！</p><button class="primary" onclick="start(mode)">再玩一次</button>';return}let q=arr[i];g.innerHTML='<h2>'+(mode==='reading'?'📖 Reading':'🎧 Listening')+' · '+(i+1)+'/'+arr.length+'</h2>'+(mode==='listening'?'<p>先听句子，再选正确的内容。</p><button onclick="speak()">🔊 播放英文</button>':'<p>'+q.q+'</p>')+q.o.map((x,j)=>'<button id="o'+j+'" onclick="choose('+j+')">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('')+'<div id="feedback"></div>'}function choose(j){if(answered)return;answered=true;let q=questions[mode][i];let ok=j===q.a;if(ok)reward();document.getElementById('feedback').innerHTML='<p class="'+(ok?'good':'bad')+'">'+(ok?'✓ 正确！+10 XP':'✗ 正确答案：'+q.o[q.a])+'</p><p>'+q.e+'</p><button class="primary" onclick="i++;render()">下一题 →</button>'}function checkWriting(){let t=document.getElementById('draft').value.trim();if(!t){document.getElementById('feedback').textContent='请先输入一句英文。';return}document.getElementById('feedback').innerHTML='<p class="good">参考答案：</p><p>Regular exercise benefits both physical and mental health while reducing stress.</p><p>请自行检查：是否涵盖三个要点？是否有语法错误？这不是自动评分。</p>'}save();</script></body></html>
